version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: flux_one_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: flux_one
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flux_one"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
