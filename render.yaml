databases:
  - name: flux-one-db
    databaseName: flux_one
    user: flux_one
    region: oregon
    # Free PostgreSQL expires after 30 days. Upgrade for ongoing production use.
    plan: free

services:
  - type: web
    name: flux-one
    runtime: docker
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: flux-one-db
          property: connectionString
