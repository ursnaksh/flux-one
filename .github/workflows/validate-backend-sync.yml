name: Validate backend persistence repairs

on:
  push:
    branches:
      - feature/gemini-fastapi

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gemini-fastapi
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Compile FastAPI code
        run: python -m compileall -q backend/app backend/alembic
      - name: Import API routes
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/flux_one
        run: python -c "import app.main; import app.api.v1.endpoints.sessions; import app.services.session_service; import app.services.ai_service"
      - name: Check frontend sync scripts
        run: |
          node --check assets/backend-sync.js
          node --check assets/ai-fastapi.js
      - name: Ensure scripts are wired
        run: |
          grep -q 'assets/backend-sync.js' index.html
          grep -q 'assets/ai-fastapi.js' index.html
      - name: Remove temporary validation workflow
        shell: bash
        run: |
          git rm .github/workflows/validate-backend-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: backend persistence repairs validated"
          git push origin HEAD:feature/gemini-fastapi
