name: Wire content sync frontend

on:
  push:
    branches:
      - feature/gemini-fastapi

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gemini-fastapi
          fetch-depth: 0
      - name: Load content sync frontend
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          backend_tag = '  <script src="assets/backend-sync.js"></script>\n'
          content_tag = '  <script src="assets/content-sync.js"></script>\n'
          if content_tag not in text:
              if backend_tag in text:
                  text = text.replace(backend_tag, backend_tag + content_tag, 1)
              elif '</body>' in text:
                  text = text.replace('</body>', content_tag + '</body>', 1)
              else:
                  raise SystemExit('index.html has no insertion point')
              path.write_text(text, encoding='utf-8', newline='\n')
          PY
          git rm .github/workflows/wire-content-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: load persistent notes and assignments sync"
          git push origin HEAD:feature/gemini-fastapi
