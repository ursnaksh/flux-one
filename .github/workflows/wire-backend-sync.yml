name: Wire backend sync frontend

on:
  push:
    branches:
      - feature/gemini-fastapi

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gemini-fastapi
          fetch-depth: 0
      - name: Load backend sync before AI controls
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          ai_tag = '  <script src="assets/ai-fastapi.js"></script>\n'
          sync_tag = '  <script src="assets/backend-sync.js"></script>\n'
          if sync_tag not in text:
              if ai_tag in text:
                  text = text.replace(ai_tag, sync_tag + ai_tag, 1)
              elif '</body>' in text:
                  text = text.replace('</body>', sync_tag + '</body>', 1)
              else:
                  raise SystemExit('index.html has no insertion point')
              path.write_text(text, encoding='utf-8', newline='\n')
          PY
          git rm .github/workflows/wire-backend-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: load persistent backend sync layer"
          git push origin HEAD:feature/gemini-fastapi
