name: Harden study session start

on:
  push:
    branches:
      - feature/gemini-fastapi

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gemini-fastapi
          fetch-depth: 0
      - name: Require active enrollment and valid topic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/app/services/session_service.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'from sqlalchemy.ext.asyncio import AsyncSession\n',
              'from sqlalchemy import select\nfrom sqlalchemy.ext.asyncio import AsyncSession\n',
              1,
          )
          text = text.replace(
              'from app.models.enums import SessionSource, SessionStatus\n',
              'from app.models.enums import EnrollmentStatus, SessionSource, SessionStatus\nfrom app.models.institution import Topic\nfrom app.models.student import Enrollment\n',
              1,
          )
          needle = '''        await self.reconcile_active_sessions(user_id)\n\n        now = datetime.now(timezone.utc)\n'''
          replacement = '''        await self.reconcile_active_sessions(user_id)\n\n        enrollment_result = await self.db.execute(\n            select(Enrollment.id).where(\n                Enrollment.user_id == user_id,\n                Enrollment.subject_id == request.subject_id,\n                Enrollment.status == EnrollmentStatus.ACTIVE,\n            )\n        )\n        if enrollment_result.scalar_one_or_none() is None:\n            raise HTTPException(\n                status_code=status.HTTP_403_FORBIDDEN,\n                detail="You are not actively enrolled in the selected subject.",\n            )\n\n        if request.topic_id is not None:\n            topic_result = await self.db.execute(\n                select(Topic.id).where(\n                    Topic.id == request.topic_id,\n                    Topic.subject_id == request.subject_id,\n                )\n            )\n            if topic_result.scalar_one_or_none() is None:\n                raise HTTPException(\n                    status_code=status.HTTP_422_UNPROCESSABLE_ENTITY,\n                    detail="The selected topic does not belong to this subject.",\n                )\n\n        now = datetime.now(timezone.utc)\n'''
          if needle not in text:
              raise SystemExit('start_session insertion point not found')
          text = text.replace(needle, replacement, 1)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          git rm .github/workflows/harden-session-start.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/services/session_service.py
          git commit -m "fix: validate study session subject enrollment"
          git push origin HEAD:feature/gemini-fastapi
