name: Wire Gemini frontend asset

on:
  push:
    branches:
      - feature/gemini-fastapi

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gemini-fastapi
          fetch-depth: 0
      - name: Add AI script and remove temporary workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          tag = '  <script src="assets/ai-fastapi.js"></script>\n'
          if tag not in text:
              if '</body>' not in text:
                  raise SystemExit('index.html has no </body> tag')
              text = text.replace('</body>', tag + '</body>', 1)
              path.write_text(text, encoding='utf-8', newline='\n')
          PY
          git rm .github/workflows/patch-ai-script.yml
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: load Gemini FastAPI frontend controls"
          git push origin HEAD:feature/gemini-fastapi
