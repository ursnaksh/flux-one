name: Wire persistent student content

on:
  push:
    branches:
      - feature/gemini-fastapi

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gemini-fastapi
          fetch-depth: 0
      - name: Extend backend sync layer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('assets/backend-sync.js')
          text = path.read_text(encoding='utf-8')
          marker = '  const originalShowAppView = window.showAppView;\n'
          if marker not in text:
              raise SystemExit('backend-sync insertion point not found')
          if 'async function hydrateStudentContent()' in text:
              raise SystemExit('student content sync already present')
          addition = r'''  function courseIdForSubjectCode(code) {
    return coursesData.find(item => item.code === code)?.id || 'sat';
  }

  function assignmentPayload(item) {
    return {
      client_id: String(item.id),
      subject_id: enrolledSubjectIdForCourse(item.courseId),
      topic: item.topic || null,
      title: item.title,
      due_text: item.due || null,
      priority: item.priority || 'med',
      is_done: Boolean(item.done)
    };
  }

  function notePayload(item) {
    return {
      client_id: String(item.id),
      subject_id: enrolledSubjectIdForCourse(item.courseId),
      topic: item.topic || null,
      title: item.title,
      content: item.content || ''
    };
  }

  function mapBackendAssignments(rows) {
    return rows.map(row => ({
      id: row.client_id,
      courseId: courseIdForSubjectCode(row.subject_code),
      topic: row.topic || '',
      title: row.title,
      due: row.due_text || '',
      priority: row.priority || 'med',
      done: Boolean(row.is_done)
    }));
  }

  function mapBackendNotes(rows) {
    return rows.map(row => ({
      id: row.client_id,
      courseId: courseIdForSubjectCode(row.subject_code),
      topic: row.topic || '',
      title: row.title,
      content: row.content,
      date: new Date(row.updated_at).toLocaleDateString()
    }));
  }

  async function hydrateStudentContent() {
    if (!isSignedIn()) return;
    try {
      const assignmentItems = assignments.map(item => assignmentPayload(item));
      const noteItems = notesList
        .filter(item => String(item.content || '').trim())
        .map(item => notePayload(item));

      const [backendAssignments, backendNotes] = await Promise.all([
        authenticatedFetch('/student-data/assignments/sync', {
          method: 'POST',
          body: JSON.stringify({ items: assignmentItems })
        }),
        authenticatedFetch('/student-data/notes/sync', {
          method: 'POST',
          body: JSON.stringify({ items: noteItems })
        })
      ]);

      assignments = mapBackendAssignments(backendAssignments);
      notesList = mapBackendNotes(backendNotes);
      localStorage.setItem('flux_assignments', JSON.stringify(assignments));
      localStorage.setItem('flux_notes_v2', JSON.stringify(notesList));
      renderAssignmentsFull();
      renderNotes();
      renderDashboard();
    } catch (error) {
      console.warn('Student content sync failed:', error);
    }
  }

  window.toggleAssignment = async function toggleAssignmentSynced(id) {
    const assignment = assignments.find(item => item.id === id);
    if (!assignment) return;
    const nextDone = !assignment.done;

    if (!isSignedIn()) {
      assignment.done = nextDone;
      localStorage.setItem('flux_assignments', JSON.stringify(assignments));
      renderAssignmentsFull();
      renderDashboard();
      return;
    }

    try {
      const saved = await authenticatedFetch(`/student-data/assignments/${encodeURIComponent(id)}`, {
        method: 'PATCH',
        body: JSON.stringify({ is_done: nextDone })
      });
      assignment.done = Boolean(saved.is_done);
      localStorage.setItem('flux_assignments', JSON.stringify(assignments));
      renderAssignmentsFull();
      renderDashboard();
    } catch (error) {
      alert(`Assignment was not synced: ${error.message}`);
      renderAssignmentsFull();
    }
  };

  window.saveNewNote = async function saveNewNoteSynced() {
    const courseId = document.getElementById('modal-note-course')?.value;
    const topic = document.getElementById('modal-note-topic')?.value || '';
    const title = document.getElementById('modal-note-title')?.value.trim() || 'Untitled Note';
    const content = document.getElementById('modal-note-content')?.value.trim() || '';
    if (!content) {
      alert('Write something in the note before saving.');
      return;
    }

    const clientId = `n_${Date.now()}`;
    const localNote = {
      id: clientId,
      courseId,
      topic,
      title,
      content,
      date: 'Today'
    };

    if (!isSignedIn()) {
      notesList.unshift(localNote);
      localStorage.setItem('flux_notes_v2', JSON.stringify(notesList));
      closeNewNoteModal();
      renderNotes();
      return;
    }

    try {
      const saved = await authenticatedFetch('/student-data/notes', {
        method: 'POST',
        body: JSON.stringify(notePayload(localNote))
      });
      notesList.unshift(mapBackendNotes([saved])[0]);
      localStorage.setItem('flux_notes_v2', JSON.stringify(notesList));
      closeNewNoteModal();
      renderNotes();
      renderDashboard();
    } catch (error) {
      alert(`Note was not saved to FLUX ONE: ${error.message}`);
    }
  };

  window.deleteNote = async function deleteNoteSynced(id) {
    if (!confirm('Delete this note?')) return;

    if (isSignedIn()) {
      try {
        await authenticatedFetch(`/student-data/notes/${encodeURIComponent(id)}`, {
          method: 'DELETE'
        });
      } catch (error) {
        alert(`Note was not deleted: ${error.message}`);
        return;
      }
    }

    notesList = notesList.filter(note => note.id !== id);
    localStorage.setItem('flux_notes_v2', JSON.stringify(notesList));
    renderNotes();
    renderDashboard();
  };

'''
          text = text.replace(marker, addition + marker, 1)
          text = text.replace(
              '        recoverActiveSession();\n',
              '        recoverActiveSession();\n        hydrateStudentContent();\n',
              1,
          )
          text = text.replace(
              '      recoverActiveSession();\n',
              '      recoverActiveSession();\n      hydrateStudentContent();\n',
              1,
          )
          text = text.replace(
              '    recoverActiveSession,\n    escapeFluxSync\n',
              '    recoverActiveSession,\n    hydrateStudentContent,\n    escapeFluxSync\n',
              1,
          )
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          git rm .github/workflows/patch-student-content-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/backend-sync.js
          git commit -m "feat: persist notes and assignments through FastAPI"
          git push origin HEAD:feature/gemini-fastapi
