name: Validate Gemini FastAPI port

on:
  push:
    branches:
      - feature/gemini-fastapi

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gemini-fastapi
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Compile Python
        run: python -m compileall -q backend/app backend/alembic
      - name: Import FastAPI app and AI service
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/flux_one
        run: python -c "import app.main; import app.services.ai_service; import app.schemas.ai"
      - name: Check AI frontend JavaScript syntax
        run: node --check assets/ai-fastapi.js
      - name: Remove temporary validation workflow
        shell: bash
        run: |
          git rm .github/workflows/validate-gemini-fastapi.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: Gemini FastAPI port validated"
          git push origin HEAD:feature/gemini-fastapi
